# 자동차공학실험 시연 트랙 (2026-11-26 사진 4장에서 복원). 3D 시뮬의 단일 원본이다.
# 이 파일을 고치고 tools/autolab_track/build_track.py 를 다시 돌리면
# 2D 점유맵(autolab_track.png/.yaml, 라이다·충돌용)이 새로 만들어진다.
# 가상 카메라(fake_camera)와 RViz 3D 마커(track_markers)는 실행할 때 이 파일을 직접 읽는다.
#
# 좌표: map 프레임, m. x 오른쪽, y 위쪽 (위에서 내려다본 2층 사진 기준).
#   600 mm 바닥 타일 격자에 맞춰 잡았다. 타일 줄눈이 x, y = 0.6 의 배수에 온다.
# 정확도: 사진 원근 보정이라 덕트·테이프 위치는 ±10 cm 안팎이다.
#   전시차 옆 오른쪽 바깥 덕트(outer_duct 의 x > 5 부분)와 차량(scenery)은 사진에서
#   가려진 부분이 있어 더 거칠다. 줄자로 잰 값이 있으면 그 값으로 바꾼다.

name: autolab_track
bounds: {x: [-4.0, 9.0], y: [-7.5, 5.5]}   # 맵 범위. 가장자리에 벽(높이 wall_height)을 세운다
wall_height: 2.5

floor:
  tile_m: 0.6
  light_bgr: [182, 195, 212]   # 상아색 타일 (폰 사진 HSV 13, 36, 212)
  dark_bgr: [87, 85, 82]       # 회색 타일 (HSV 103, 16, 87)
  grout_darken: 0.90           # 줄눈 밝기 배율
  # 밝은/어두운 바닥 경계. 두 점을 지나는 직선이고, dark_side 쪽이 회색 타일이다
  boundary: {p1: [-1.85, -0.83], p2: [3.4, -3.91], dark_side: [0.0, -6.0]}

ducts:
  radius: 0.15                 # 지름 300 mm 주름 덕트. 바닥에 누워 있다
  bgr: [80, 74, 73]
  rib_pitch_m: 0.06            # 주름 간격 (렌더링용)
  lines:
    inner:                     # 안쪽 U자. 두 끝은 차선 구간 테이프와 맞닿는다
      - [-0.55, -3.10]
      - [-0.60, -1.00]
      - [-0.62, 0.40]
      - [-0.45, 0.90]
      - [0.00, 1.12]
      - [2.00, 1.15]
      - [4.00, 1.20]
      - [4.55, 1.25]
      - [4.70, 0.95]
      - [4.30, 0.50]
      - [4.00, 0.00]
      - [3.95, -1.00]
      - [3.90, -2.00]
      - [3.83, -2.77]
    outer:                     # 바깥쪽. 오른쪽은 전시차(A1) 옆을 지나 차선 구간까지 내려온다
      - [-2.10, -3.00]
      - [-2.10, -1.00]
      - [-2.15, 1.00]
      - [-2.15, 2.40]
      - [-1.90, 2.80]
      - [-1.00, 2.85]
      - [1.00, 2.82]
      - [3.00, 2.72]
      - [4.50, 2.50]
      - [5.30, 2.20]
      - [6.00, 1.60]
      - [6.20, 0.80]
      - [5.80, -0.20]
      - [5.45, -1.20]
      - [5.30, -2.00]
      - [5.25, -2.80]

tapes:
  width: 0.048                 # 48 mm 노란 테이프
  bgr: [109, 195, 205]         # 폰 사진 HSV 27, 120, 205. FLIR 로 다시 재서 바꾼다
  lines:
    inner:                     # 안쪽 덕트 왼쪽 끝 → 아래 → 오른쪽 → 안쪽 덕트 오른쪽 끝
      - [-0.55, -3.12]
      - [-0.60, -4.40]
      - [4.00, -3.90]
      - [3.84, -2.83]
    outer:                     # 바깥 덕트 왼쪽 끝 → 모서리 깎은 아래 → 바깥 덕트 오른쪽 끝
      - [-1.80, -3.00]
      - [-1.80, -5.10]
      - [-1.40, -5.50]
      - [2.15, -5.17]
      - [4.70, -4.95]
      - [5.35, -4.35]
      - [5.25, -2.85]

# 트랙 안의 장애물 (생수병 든 흰 봉투). 라이다·충돌·카메라에 모두 보인다
obstacles:
  - {center: [0.65, 1.81], size: [0.25, 0.25, 0.30], yaw: 0.0, bgr: [225, 228, 230]}
  - {center: [3.19, 2.28], size: [0.25, 0.25, 0.30], yaw: 0.0, bgr: [225, 228, 230]}

# 트랙 밖 배경 물체 (대략값). 차선 구간에서 라이다가 보는 먼 물체를 흉내 낸다
scenery:
  - {name: a1_car, center: [7.05, -1.10], size: [1.85, 4.40, 1.60], yaw: -0.15, bgr: [190, 192, 195]}
  - {name: grey_suv, center: [7.10, 3.70], size: [4.30, 1.85, 1.60], yaw: -0.10, bgr: [110, 112, 115]}
  - {name: chassis, center: [2.80, 4.60], size: [4.00, 1.80, 1.40], yaw: 0.05, bgr: [170, 120, 200]}

# 시뮬 시작 자세. 오른쪽 덕트 통로 가운데에서 위쪽(+y)을 보고 반시계로 돈다
start: {x: 4.70, y: -1.50, theta: 1.5708}
