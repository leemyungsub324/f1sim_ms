name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    # ubuntu-latest (26.04) has no Python 3.9; 22.04 matches ROS 2 Humble
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: |
        python -m pip install --upgrade pip
        # gym 0.19.0's setup.py has an invalid requirement ("opencv-python>=3.")
        # that current setuptools/packaging reject. Patch the sdist, then install.
        mkdir -p /tmp/gym && cd /tmp/gym
        curl -sSL https://files.pythonhosted.org/packages/source/g/gym/gym-0.19.0.tar.gz | tar xz
        sed -i 's/opencv-python>=3\./opencv-python>=3/' gym-0.19.0/setup.py
        pip install ./gym-0.19.0
        cd "$GITHUB_WORKSPACE"
        pip install -e .

    - name: Smoke test
      run: |
        python -c "import gym, f110_gym; env = gym.make('f110_gym:f110-v0', num_agents=1); print('env created:', env)"
